name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - logo.png
      - icon.png
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Capacitor project
        run: |
          mkdir -p www assets
          cp index.html logo.png www/
          cp icon.png assets/icon.png
          cat > make-manifest.js <<'EOF'
          const fs = require('fs'), c = require('crypto');
          const files = fs.readdirSync('.').filter(f => f.endsWith('.json') && !/^(package|package-lock|manifest)/.test(f));
          const sha = f => { const b = fs.readFileSync(f); return c.createHash('sha1').update('blob ' + b.length + '\0').update(b).digest('hex'); };
          const sig = files.map(f => f + ':' + sha(f)).sort().join('|');
          files.forEach(f => fs.copyFileSync(f, 'www/' + f));
          fs.writeFileSync('www/manifest.json', JSON.stringify({ build: ${{ github.run_number }}, files: files, sig: sig }));
          console.log(files);
          EOF
          node make-manifest.js
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3
          npx cap init "Pharmacist Book" com.pharmacistbook.app --web-dir www
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' || echo "icon generation skipped"
          npx cap sync android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">كتاب الصيدلاني</string>#' android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="title_activity_main">.*</string>#<string name="title_activity_main">كتاب الصيدلاني</string>#' android/app/src/main/res/values/strings.xml

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ ! -f release.keystore ] || [ -z "$KEY_PASS" ]; then
            echo "WARNING: keystore or KEY_PASS missing, using a temporary key. Do not share this APK."
            export KEY_PASS="temporary-pass-123"
            rm -f release.keystore
            keytool -genkeypair -keystore release.keystore -alias pharmacist -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEY_PASS" -keypass "$KEY_PASS" -dname "CN=Pharmacist Book"
          fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.keystore --ks-key-alias pharmacist --ks-pass env:KEY_PASS --key-pass env:KEY_PASS --out pharmacist-book.apk aligned.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: pharmacist-book.apk
