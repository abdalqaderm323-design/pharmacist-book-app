<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<title>كتاب الصيدلاني</title>
<style>
:root{--navy:#0B1F3A;--panel:#12294D;--gold:#D4AF37;--text:#F2E3A8;--muted:#B99A3E;--line:#3A4F73;--red:#F09595;--amber:#EF9F27;--green:#97C459}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--navy);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Noto Naskh Arabic",sans-serif;font-size:16px;line-height:1.5}
#app{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.bar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--gold);position:sticky;top:env(safe-area-inset-top,0);background:var(--navy);z-index:5}
.bar h1{margin:0;font-size:19px;font-weight:600;color:var(--gold);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.icon.fill{fill:var(--gold)}
[dir=ltr] .flip{transform:scaleX(-1)}
.btn-i{background:none;border:0;padding:4px;cursor:pointer;display:flex;color:inherit}
.wrap{padding:16px}
.input{width:100%;height:46px;background:var(--panel);border:1px solid var(--gold);color:var(--text);border-radius:12px;padding:0 14px;font-size:16px;font-family:inherit;outline:none}
.input::placeholder{color:var(--muted)}
textarea.input{height:auto;min-height:200px;padding:12px;resize:vertical;line-height:1.6}
.search{position:relative}
.search .icon{position:absolute;inset-inline-start:12px;top:10px;width:22px;height:22px;pointer-events:none}
.search .input{padding-inline-start:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:20px;padding:7px 14px;font-size:14px;font-family:inherit;cursor:pointer}
.chip.on{background:var(--gold);color:var(--navy);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border:1px solid var(--gold);background:var(--panel);border-radius:12px;padding:14px;min-height:78px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:start;color:var(--text);font-family:inherit;font-size:15px;font-weight:600}
.card small{color:var(--muted);font-size:12px;font-weight:400}
.row{display:flex;align-items:center;gap:12px;border:1px solid var(--gold);background:var(--panel);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;color:var(--text);width:100%;font-family:inherit;font-size:16px;text-align:start}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600}
.muted{color:var(--muted);font-size:13px}
.primary{width:100%;background:var(--gold);color:var(--navy);border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.danger{width:100%;background:transparent;color:var(--red);border:1px solid var(--red);border-radius:10px;padding:12px;font-size:15px;cursor:pointer;font-family:inherit;margin-top:10px}
.label{color:var(--gold);font-size:14px;margin:16px 0 6px}
.badge{border:1px solid;border-radius:20px;padding:2px 12px;font-size:13px;white-space:nowrap}
.empty{text-align:center;margin-top:60px;padding:0 20px}
.empty b{display:block;font-size:17px;margin-bottom:8px}
.err{color:var(--red);font-size:14px;margin-top:10px;text-align:center}
.box{border:1px solid var(--gold);background:var(--panel);border-radius:12px;padding:16px;margin-top:16px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:.5px solid var(--line)}
.kv span:first-child{color:var(--muted);font-size:14px}
.kv span:last-child{font-weight:600;text-align:end}
.sug{padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-top:4px;cursor:pointer}
.topic h3{color:var(--gold);margin:20px 0 6px;font-size:17px}
.topic p{margin:0;white-space:pre-wrap}
.disc{color:var(--muted);font-size:12px;text-align:center;margin-top:28px}
#drawer-wrap{position:fixed;inset:0;display:none;z-index:20}
#drawer-wrap.open{display:flex}
.drawer{width:82%;max-width:330px;background:var(--navy);border-inline-end:1px solid var(--gold);padding:calc(16px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));overflow-y:auto;display:flex;flex-direction:column}
.overlay{flex:1;background:rgba(0,0,0,.6)}
.drawer .head{display:flex;align-items:center;gap:10px;color:var(--gold);font-size:18px;font-weight:600;padding-bottom:12px;border-bottom:1px solid var(--gold);margin-bottom:6px}
.drawer .head img{width:34px;height:34px;border-radius:8px}
.grp{border-bottom:.5px solid var(--line)}
.ghd{display:flex;align-items:center;gap:10px;padding:12px 6px;color:var(--gold);font-weight:600;font-size:16px;cursor:pointer;background:none;border:0;width:100%;font-family:inherit;text-align:start}
.ghd .t{flex:1}
.gbody{padding-inline-start:24px;padding-bottom:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 6px;color:var(--text);font-size:15px;cursor:pointer;background:none;border:0;width:100%;font-family:inherit;text-align:start}
.item .icon{width:22px;height:22px}
.pills{display:flex;gap:8px;padding:2px 6px 12px;flex-wrap:wrap}
.drawer .ver{margin-top:auto;padding-top:16px;color:var(--muted);font-size:12px;text-align:center}
#splash{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s}
#splash img{width:150px;height:150px}
#splash div{color:var(--gold);font-size:22px;font-weight:600}
#splash.hide{opacity:0;pointer-events:none}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));inset-inline:16px;background:var(--panel);border:1px solid var(--gold);color:var(--text);border-radius:12px;padding:12px 16px;text-align:center;z-index:40;display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:45;display:flex;align-items:center;justify-content:center;padding:24px}
.modal .box{margin:0;width:100%;max-width:360px;background:var(--navy)}
.modal .box p{margin:0 0 16px}
</style>
</head>

    }
    var rl = opt.recs && (opt.recs[lang] || opt.recs.en || opt.recs.ar);
    if (rl && rl.length) { box.appendChild(h('div', { class: 'label', text: t('recs') })); rl.forEach(function (x) { box.appendChild(h('p', { style: 'margin:0 0 6px', text: '• ' + x })); }); }
    out.appendChild(box);
  } }));
  wrap.appendChild(err); wrap.appendChild(out); wrap.appendChild(h('div', { class: 'disc', text: t('disclaimer') }));
  if (!doses.length) wrap.insertBefore(h('div', { class: 'empty muted', text: t('noDoseData') }), wrap.firstChild);
  drawOpts(); drawStr(); drawSex(); app.appendChild(wrap);
}

function pageNotes() {
  var app = document.getElementById('app'); app.innerHTML = '';
  app.appendChild(topBar(t('catNotes'), { right: btnI('plus', t('newNote'), function () { go('note-new'); }) }));
  var wrap = h('div', { class: 'wrap' });
  if (!notes.length) wrap.appendChild(emptyState(t('notesEmptyT'), t('notesEmptyS')));
  notes.slice().sort(function (a, b) { return b.ts - a.ts; }).forEach(function (n) {
    var date = new Date(n.ts).toLocaleDateString(lang === 'ar' ? 'ar-IQ' : 'en-GB');
    wrap.appendChild(rowEl(null, n.title || t('newNote'), (n.body || '').slice(0, 60) + ' · ' + date, function () { go('note-' + n.id); }));
  });
  app.appendChild(wrap);
}

function pageNote(id) {
  var n = null; if (id !== 'new') notes.forEach(function (x) { if (x.id === id) n = x; });
  var app = document.getElementById('app'); app.innerHTML = ''; app.appendChild(topBar(t('catNotes')));
  var wrap = h('div', { class: 'wrap' });
  var ti = h('input', { class: 'input', type: 'text', placeholder: t('noteTitle') }); ti.value = n ? n.title : '';
  var bo = h('textarea', { class: 'input', placeholder: t('noteBody') }); bo.value = n ? n.body : '';
  wrap.appendChild(ti); wrap.appendChild(h('div', { style: 'height:12px' })); wrap.appendChild(bo); wrap.appendChild(h('div', { style: 'height:14px' }));
  wrap.appendChild(h('button', { class: 'primary', text: t('save'), onclick: function () {
    var title = ti.value.trim(), body = bo.value.trim();
    if (!title && !body) { go('notes'); return; }
    if (n) { n.title = title; n.body = body; n.ts = Date.now(); }
    else notes.push({ id: 'n' + Date.now(), title: title, body: body, ts: Date.now() });
    put('notes', notes); go('notes');
  } }));
  if (n) wrap.appendChild(h('button', { class: 'danger', text: t('del'), onclick: function () {
    notes = notes.filter(function (x) { return x.id !== n.id; }); put('notes', notes); go('notes');
  } }));
  app.appendChild(wrap);
}

/* ---------- update ---------- */
function verNum(v) { return String(v || '0').split('.').map(function (x) { return parseInt(x, 10) || 0; }); }
function newer(a, b) { var x = verNum(a), y = verNum(b); for (var i = 0; i < 3; i++) { if ((x[i] || 0) > (y[i] || 0)) return true; if ((x[i] || 0) < (y[i] || 0)) return false; } return false; }
function modal(msg, btnText, fn) {
  var m = h('div', { class: 'modal' }, [h('div', { class: 'box' }, [h('p', { text: msg }),
    btnText ? h('button', { class: 'primary', text: btnText, onclick: function () { fn(); } }) : null,
    h('button', { class: 'danger', style: 'border-color:var(--gold);color:var(--gold)', text: t('close'), onclick: function () { m.remove(); } })])]);
  document.body.appendChild(m);
}
function checkAppVersion() {
  if (DATA.app && DATA.app.apkUrl && newer(DATA.app.latestVersion, APP_VERSION)) {
    modal(t('updNewApp'), t('updDownload'), function () { window.open(DATA.app.apkUrl, '_blank'); }); return true;
  }
  return false;
}
function doUpdate() {
  if (REPO.indexOf('YOUR-') >= 0) { toast(t('updCfg')); return; }
  toast(t('updChecking'));
  var ctl = new AbortController(); var to = setTimeout(function () { ctl.abort(); }, 15000);
  fetch('https://api.github.com/repos/' + REPO + '/contents/?ref=' + BRANCH, { signal: ctl.signal, cache: 'no-store', headers: { Accept: 'application/vnd.github+json' } })
    .then(function (r) { if (!r.ok) throw new Error('list'); return r.json(); })
    .then(function (list) {
      var files = list.filter(function (f) { return f.type === 'file' && /\.json$/i.test(f.name) && !/^(package|package-lock|manifest)/i.test(f.name); });
      var sig = files.map(function (f) { return f.name + ':' + f.sha; }).sort().join('|');
      if (sig === CURSIG) { clearTimeout(to); if (!checkAppVersion()) toast(t('updLatest')); return; }
      return Promise.all(files.map(function (f) {
        return fetch('https://raw.githubusercontent.com/' + REPO + '/' + BRANCH + '/' + encodeURIComponent(f.name) + '?t=' + Date.now(), { signal: ctl.signal, cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error('get'); return r.text(); })
          .then(function (txt) {
            var j; try { j = JSON.parse(txt); } catch (e) { var er = new Error('badjson'); er.file = f.name; throw er; }
            if (!j || typeof j !== 'object') { var er2 = new Error('badjson'); er2.file = f.name; throw er2; }
            return { name: f.name, json: j };
          });
      })).then(function (srcs) {
        clearTimeout(to);
        put('dataOverride', { base: BUNDLE.build, sig: sig, srcs: srcs }); CURSIG = sig; setData(srcs);
        toast(t('updOk')); render(); setTimeout(checkAppVersion, 600);
      });
    })
    .catch(function (e) {
      clearTimeout(to);
      if (e && e.message === 'badjson') modal(t('badFile') + ': ' + e.file, null, null);
      else if (e && e.message === 'list') toast(t('updFail'));
      else toast(t('updOffline'));
    });
}

/* ---------- router ---------- */
function render() {
  if (!DATA) return;
  closeDrawer();
  var r = location.hash.replace('#', '') || 'home';
  if (r === 'home') pageHome();
  else if (r === 'saved') pageSaved();
  else if (r === 'continue') pageContinue();
  else if (r === 'sections') pageSections();
  else if (r === 'list-drugs') pageList('drugs');
  else if (r === 'list-diseases') pageList('diseases');
  else if (r === 'calc') pageCalc();
  else if (r === 'inter') pageInter();
  else if (r === 'notes') pageNotes();
  else if (r.indexOf('note-') === 0) pageNote(r.slice(5));
  else if (r.indexOf('topic-') === 0) pageTopic(r.slice(6));
  else pageHome();
  window.scrollTo(0, 0);
}
function hideSplash() { var s = document.getElementById('splash'); s.classList.add('hide'); setTimeout(function () { s.style.display = 'none'; }, 500); }

window.addEventListener('hashchange', render);
applyLang();
loadData(function () { render(); setTimeout(hideSplash, 900); });
})();
</script>
